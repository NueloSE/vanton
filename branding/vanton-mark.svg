<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Vanton mark: the gate (V) and the coin (amber). Brand: brand.md -->
  <rect width="512" height="512" fill="#0A0F1C"/>
  <!-- the gate: single-stroke V, flat-cut vertex -->
  <polygon points="100,118 174,118 256,321 338,118 412,118 292,430 220,430" fill="#E9EDF5"/>
  <!-- the coin, passing the gate -->
  <circle cx="256" cy="140" r="56" fill="#FFB020"/>
</svg>
